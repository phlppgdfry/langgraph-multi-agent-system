<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glowing background elements -->
  <circle cx="600" cy="180" r="250" fill="#0284c7" opacity="0.18" filter="url(#glow)"/>
  <circle cx="950" cy="450" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="200" cy="480" r="200" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Logo and Pill -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#accent)"/>
    <text x="28" y="38" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle" fill="#ffffff">🤖</text>
    
    <rect x="76" y="10" width="230" height="36" rx="18" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
    <text x="191" y="33" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#38bdf8" letter-spacing="1.5">LANGGRAPH v1.2 SWARM</text>
  </g>

  <!-- Title -->
  <text x="100" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    NEXUS INTELLIGENCE
  </text>
  <text x="100" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#brand)" letter-spacing="-1.5">
    AUTONOMOUS SWARM
  </text>

  <!-- Subtitle -->
  <text x="100" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Stateful Multi-Agent Orchestration • Reflection Self-Correction • LangSmith Tracing
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="42" rx="10" fill="rgba(30,41,59,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="90" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#38bdf8">🧭 StateGraph</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="200" height="42" rx="10" fill="rgba(30,41,59,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="300" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#c084fc">⚖️ Reflection Loop</text>

    <!-- Pill 3 -->
    <rect x="420" y="0" width="220" height="42" rx="10" fill="rgba(30,41,59,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="530" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#4ade80">🔍 LangSmith Tracing</text>

    <!-- Pill 4 -->
    <rect x="660" y="0" width="210" height="42" rx="10" fill="rgba(30,41,59,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="765" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#fb923c">🛡️ Human-in-the-Loop</text>
  </g>

  <!-- Author tag -->
  <text x="1100" y="580" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="end" fill="#64748b">
    github.com/phlppgdfry/langgraph-multi-agent-system
  </text>
</svg>
