[project]
name = "langgraph-multi-agent-system"
version = "0.1.0"
description = "Production-ready autonomous multi-agent intelligence swarm built with LangGraph, LangChain Core, LangSmith observability, and Human-in-the-Loop governance."
readme = "README.md"
license = "MIT"
keywords = [
    "langchain",
    "langgraph",
    "langsmith",
    "multi-agent",
    "agentic-ai",
    "orchestration",
    "reflection",
    "human-in-the-loop"
]
authors = [
    { name = "Philippe Godfroy", email = "philippe.godfroy@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckduckgo-search>=8.1.1",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "langsmith>=0.14.12",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "streamlit>=1.66.1",
    "tabulate>=0.10.0",
]

[project.scripts]
nexus = "langgraph_multi_agent_system.cli:main"
langgraph-swarm = "langgraph_multi_agent_system.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
